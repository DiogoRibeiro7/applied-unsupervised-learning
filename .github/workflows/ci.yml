name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Mypy (type check)
        run: poetry run mypy src

      - name: Pytest
        run: poetry run pytest -q

      - name: Notebook smoke execution
        run: poetry run python scripts/run_all_notebooks.py --only 00_project_overview.ipynb
