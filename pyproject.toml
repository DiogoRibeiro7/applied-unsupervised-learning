[project]
name = "unsupervised-learning-lab"
version = "0.1.0"
description = "Notebook-first portfolio repository for applied unsupervised learning."
authors = [{ name = "Diogo Ribeiro", email = "hansolo.dj@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "joblib>=1.4",
    "pyyaml>=6.0,<7.0",
    "jupyterlab>=4.2.0,<5.0.0",
    "ipykernel>=6.29.0,<7.0.0",
    "nbclient>=0.10.0,<0.11.0",
    "nbformat>=5.10.0,<6.0.0",
]

[project.scripts]
unsup-lab = "unsup_lab.cli:main"

[tool.poetry]
packages = [{ include = "unsup_lab", from = "src" }]

# Dependency groups stay under [tool.poetry]: they are a Poetry concept, not
# part of the PEP 621 [project] table, and `optional = true` keeps `api` and
# `deep` out of a default `poetry install`.
[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
pandas-stubs = "^2.2.0.240603"
types-pyyaml = "^6.0"

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
httpx = "^0.27.0"

[tool.poetry.group.deep]
optional = true

[tool.poetry.group.deep.dependencies]
torch = "^2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
